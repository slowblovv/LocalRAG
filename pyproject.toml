[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"

[project]
name="localrag"
version="0.2.0"
description="Local-first hybrid retrieval and grounded document QA platform."
readme="README.md"
requires-python=">=3.12"
dependencies=[
 "fastapi>=0.128,<1",
 "uvicorn[standard]>=0.30,<1",
 "pydantic>=2.8,<3",
 "pydantic-settings>=2.4,<3",
 "numpy>=2.0,<3",
 "pypdf>=5.0,<6",
 "httpx>=0.27,<1",
]
[project.optional-dependencies]
ml=["sentence-transformers>=6.1,<7","torch>=2.4,<3"]
faiss=["faiss-cpu>=1.8,<2"]
dev=["pytest>=8,<10","ruff>=0.9,<1","mypy>=1.13,<2"]
[tool.hatch.build.targets.wheel]
packages=["src/localrag"]
[tool.ruff]
line-length=100
target-version="py312"
[tool.mypy]
python_version="3.12"
strict=false
[tool.pytest.ini_options]
pythonpath=["src"]
addopts="-q"
